name: Build Vermi Veda Android Production APK
on:
  workflow_dispatch:
  push:
    branches: [android-apk-production-2026-11-01]
    paths: ['android/**', 'index.html', '.github/workflows/android-live-apk.yml']
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build production APK
        working-directory: android
        run: gradle assembleDebug
      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: Vermi-Veda-OMS-LIVE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
