plugins { id 'com.android.application' }

android {
    namespace 'com.vermiveda.oms'
    compileSdk 35
    defaultConfig {
        applicationId 'com.vermiveda.oms'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0-live'
    }
}

// AndroidX dependencies bring both the unified Kotlin stdlib and the
// legacy jdk7/jdk8 split artifacts. Exclude the obsolete split artifacts
// to prevent duplicate classes during DEX packaging.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
}
