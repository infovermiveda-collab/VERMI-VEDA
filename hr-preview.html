<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vermi Veda HRMS Preview</title>
<link rel="stylesheet" href="/hr/employee-module.css"><link rel="stylesheet" href="/hr/attendance-module.css"><link rel="stylesheet" href="/hr/leave-module.css"><link rel="stylesheet" href="/hr/onboarding-module.css">
<style>
:root{font-family:Inter,Arial,sans-serif;color:#173b29;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}.top{background:#145c39;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:20px;margin:0}.top small{opacity:.8}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 65px)}aside{background:#fff;border-right:1px solid #e0e9e2;padding:14px}aside button{display:block;width:100%;text-align:left;padding:12px;border:0;background:#fff;border-radius:8px;margin:3px 0;color:#234b35;cursor:pointer}aside button.active,aside button:hover{background:#e8f3eb;color:#12613a}main{padding:20px;min-width:0}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:18px}.login{background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 32px #1232;width:min(420px,100%)}.login input{width:100%;padding:12px;border:1px solid #ccd9ce;border-radius:8px;margin:7px 0 15px}.login button,.top button{background:#176b45;color:white;border:0;padding:11px 16px;border-radius:8px;cursor:pointer}.notice{background:#fff8df;border:1px solid #f0dfa3;padding:12px;border-radius:8px;margin-bottom:15px}.err{color:#a22;margin-top:12px}.mobile-nav{display:none}@media(max-width:760px){.layout{display:block}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid #ddd;gap:4px}aside button{white-space:nowrap;width:auto}.top{padding:14px}.top h1{font-size:17px}main{padding:12px}}
</style></head><body><div id="root"><div class="loginwrap"><form class="login" id="login"><h1>VERMI VEDA · HRMS</h1><p>Secure HR Preview Environment</p><label>Work email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in</button><div class="err" id="err"></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
const SUPABASE_URL="https://eljfrkvwhggxeaudmvsw.supabase.co";
const SUPABASE_KEY="sb_publishable_Mh_8x1sCeW9UHC8TqjDgFA_0eiC7ExQ";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const root=document.querySelector("#root");
let user=null,profile=null,employee=null;
const menu=[["hr","Employees"],["attendance","Attendance"],["leave","Leave"],["onboarding","Onboarding"],["verification","Document Verification"],["payroll","Payroll"],["performance","Performance"],["mis","HR MIS"],["audit","Audit Logs"]];
const modules={
 hr:()=>import("./hr/employee-module.js").then(m=>m.renderEmployeeModule(document.querySelector("#view"),sb,{canManage:true,currentUserId:user.id})),
 attendance:()=>import("./hr/attendance-module.js").then(m=>m.renderAttendanceModule(document.querySelector("#view"),sb,{canManage:true,currentUserId:user.id})),
 leave:()=>import("./hr/leave-module.js").then(m=>m.renderLeaveModule(document.querySelector("#view"),sb,{canManage:true,currentUserId:user.id})),
 onboarding:()=>import("./hr/onboarding-module.js").then(m=>m.renderOnboardingModule(document.querySelector("#view"),sb,{canManage:true,currentUserId:user.id})),
 verification:()=>import("./hr/onboarding-verification.js").then(m=>m.renderOnboardingVerification(document.querySelector("#view"),sb,{canManage:true,currentUserId:user.id})),
 payroll:()=>import("./hr/payroll-module.js").then(m=>m.renderPayrollModule(document.querySelector("#view"),sb,{canManage:true,currentUserId:user.id})),
 performance:()=>import("./hr/performance-module.js").then(m=>m.renderPerformanceModule(document.querySelector("#view"),sb,{canManage:true,currentUserId:user.id})),
 mis:()=>import("./hr/hr-mis-module.js").then(m=>m.renderHrMisModule(document.querySelector("#view"),sb,{canManage:true,currentUserId:user.id})),
 audit:()=>import("./hr/audit-log-module.js").then(m=>m.renderHrAuditModule(document.querySelector("#view"),sb)),
 portal:()=>import("./hr/employee-portal.js").then(m=>m.renderEmployeePortal(document.querySelector("#view"),sb,{currentUserId:user.id}))
};
function showError(e){document.querySelector("#view").innerHTML='<div class="notice">Module could not load: '+String(e?.message||e)+'</div>';}
async function openPage(id){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===id));document.querySelector("#view").innerHTML='<p>Loading…</p>';try{await modules[id]();}catch(e){showError(e)}}
function app(){root.innerHTML='<header class="top"><div><h1>VERMI VEDA HRMS · TEST PREVIEW</h1><small>Isolated HR database · No OMS connection</small></div><div>'+user.email+' <button id="logout">Log out</button></div></header><div class="layout"><aside id="nav"></aside><main><div class="notice">Preview environment only. Use dummy test data; do not upload real Aadhaar, PAN or bank documents.</div><section id="view"></section></main></div>';
const nav=document.querySelector("#nav");(profile.role==="employee"?[["portal","My Employee Portal"]]:menu).forEach(([id,label])=>{const b=document.createElement("button");b.textContent=label;b.dataset.page=id;b.onclick=()=>openPage(id);nav.append(b)});document.querySelector("#logout").onclick=async()=>{await sb.auth.signOut();location.reload()};openPage(profile.role==="employee"?"portal":"hr");}
async function start(u){user=u;const p=await sb.from("vvhr_user_profiles").select("user_id,full_name,role,active,employee_id,must_change_password").eq("user_id",u.id).maybeSingle();if(p.error||!p.data||!p.data.active){await sb.auth.signOut();document.querySelector("#err").textContent="This account is not authorised for HRMS Preview. Ask Admin to provision access.";return;}profile=p.data;if(!["admin","hr","employee"].includes(profile.role)){await sb.auth.signOut();return;}if(profile.role==="employee"){const e=await sb.from("vvhr_employees").select("id,full_name,employee_code,employment_status").eq("id",profile.employee_id).eq("auth_user_id",u.id).maybeSingle();if(e.error||!e.data){document.querySelector("#err").textContent="Employee account is not linked. Contact HR.";await sb.auth.signOut();return;}employee=e.data;}if(profile.must_change_password||u.user_metadata?.vvhr_must_change_password){root.innerHTML='<div class="loginwrap"><form class="login" id="pw"><h2>Set new password</h2><input name="password" type="password" minlength="10" required placeholder="New password (10+ characters)"><button>Update password</button><div id="pwerr" class="err"></div></form></div>';document.querySelector("#pw").onsubmit=async ev=>{ev.preventDefault();const pw=new FormData(ev.target).get("password");const r=await sb.auth.updateUser({password:pw,data:{vvhr_must_change_password:false}});if(r.error){document.querySelector("#pwerr").textContent=r.error.message;return;}await sb.from("vvhr_user_profiles").update({must_change_password:false}).eq("user_id",u.id);app()};return;}app();}
document.querySelector("#login").onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target),b=ev.target.querySelector("button");b.disabled=true;const r=await sb.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});b.disabled=false;if(r.error){document.querySelector("#err").textContent=r.error.message;return;}await start(r.data.user)};
const existing=await sb.auth.getSession();if(existing.data.session)await start(existing.data.session.user);
</script></body></html>
