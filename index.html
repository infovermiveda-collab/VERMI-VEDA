function modal(title,body){$('#modal')?.remove();document.body.insertAdjacentHTML('beforeend',`<div id="modal" style="position:fixed;inset:0;background:#0d2017a8;display:grid;place-items:center;padding:16px;z-index:99"><div style="background:white;border-radius:14px;padding:22px;width:min(580px,100%);max-height:90vh;overflow:auto"><div class="head"><h3>${title}</h3><button class="alt" id="close">×</button></div>${body}</div></div>`);$('#close').onclick=()=>$('#modal').remove();return $('#modal')}
function openOrder(id){let o=orders.find(x=>x.id===id);if(!o)return;const isAdmin=admin();let m=modal((isAdmin?'Edit order ':'Order ')+esc(o.order_no),`<form id="edit"><div class="formgrid"><div class="field"><label>Customer *</label><input name="customer" value="${esc(o.customer)}" ${isAdmin?'required':'disabled'}></div><div class="field"><label>Phone *</label><input name="phone" value="${esc(o.phone)}" ${isAdmin?'required':'disabled'}></div><div class="field"><label>Order date</label><input name="order_date" type="date" value="${esc(o.order_date)}" ${isAdmin?'required':'disabled'}></div><div class="field span3"><label>Address *</label><textarea name="address" ${isAdmin?'required':'disabled'}>${esc(o.address)}</textarea></div><div class="field"><label>Area</label><input name="area" value="${esc(o.area||'')}" ${isAdmin?'':'disabled'}></div><div class="field"><label>Assigned FE</label><select name="assigned_fe" ${isAdmin?'':'disabled'}><option value="">Unassigned</option>${staff.filter(u=>u.role==='fe'&&u.active).map(u=>`<option value="${u.id}" ${o.assigned_fe===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>Payment method</label><select name="payment_method" ${isAdmin?'':'disabled'}>${['Cash','UPI','Online prepaid','Other'].map(s=>`<option ${o.payment_method===s?'selected':''}>${s}</option>`).join('')}</select></div>${isAdmin?`<div class="field span3"><label>Products and quantities</label><div id="editItems"></div><div class="actions"><button type="button" class="alt" id="editAddItem">＋ Add product</button></div></div><div class="field"><label>Delivery fee</label><input name="delivery_fee" type="number" min="0" step=".01" value="${Number(o.delivery_fee||0)}"></div><div class="field"><label>Discount</label><input name="discount" type="number" min="0" step=".01" value="${Number(o.discount||0)}"></div>`:''}<div class="field"><label>Collected amount</label><input name="paid_amount" type="number" min="0" step=".01" value="${paid(o)}"></div><div class="field"><label>Delivery status</label><select name="delivery_status">${['New','Assigned','Out for Delivery','Delivered','Failed','Cancelled','Returned'].map(s=>`<option ${o.delivery_status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field span2"><label>Delivery remarks</label><textarea name="delivery_remark">${esc(o.delivery_remark||'')}</textarea></div><div class="field span3"><label>Delivery proof link (optional)</label><input name="delivery_proof_url" type="url" value="${esc(o.delivery_proof_url||'')}" placeholder="Paste photo link"></div><div class="field span3"><label>Notes</label><textarea name="notes">${esc(o.notes||'')}</textarea></div></div><p class="muted" id="editTotal">Order total: ${money(total(o))} · Outstanding: ${money(balance(o))}</p><div class="actions"><button type="button" class="alt" id="deliveryLocation">Record current location</button><button type="button" class="alt" id="deliveryOtp">${isAdmin?'Generate customer OTP':'Verify customer OTP'}</button></div><p class="footnote">Location is recorded only when you press the button. Delivery OTP expires after 24 hours.</p><button>${isAdmin?'Save order changes':'Save delivery/payment update'}</button></form>`);
if($('#deliveryLocation'))$('#deliveryLocation').onclick=()=>{if(!navigator.geolocation)return alert('Location is unavailable');navigator.geolocation.getCurrentPosition(async pos=>{let r=await sb.from('oms_delivery_events').insert({order_id:o.id,event_type:'Location captured',notes:'Captured by '+me.full_name,latitude:pos.coords.latitude,longitude:pos.coords.longitude,created_by:authUser.id});if(r.error)return alert(r.error.message);alert('Delivery location recorded')},err=>alert('Location permission/error: '+err.message),{enableHighAccuracy:true,timeout:10000})};
if($('#deliveryOtp'))$('#deliveryOtp').onclick=async()=>{if(isAdmin){let a=new Uint32Array(1);crypto.getRandomValues(a);let otp=String(100000+(a[0]%900000));let r=await sb.rpc('oms_set_delivery_otp',{p_order_id:o.id,p_otp:otp});if(r.error)return alert(r.error.message);alert('Customer delivery OTP: '+otp+'\\nShare this code with the customer. It expires in 24 hours.')}else{let otp=prompt('Enter the 6-digit customer OTP');if(!otp)return;if(!/^\\d{6}$/.test(otp))return alert('Enter exactly six digits');let r=await sb.rpc('oms_verify_delivery_otp',{p_order_id:o.id,p_otp:otp});if(r.error)return alert(r.error.message);if(!r.data)return alert('OTP is invalid, expired or has reached its attempt limit');let u=await sb.from('oms_orders').update({delivery_status:'Delivered',delivered_at:new Date().toISOString(),history:[...(o.history||[]),{date:new Date().toISOString(),text:'Delivery OTP verified by '+me.full_name}]}).eq('id',o.id);if(u.error)return alert(u.error.message);await sb.from('oms_delivery_events').insert({order_id:o.id,event_type:'Delivered',notes:'Customer OTP verified',created_by:authUser.id});m.remove();await refresh();render();alert('Delivery verified successfully')}};
const itemBox=$('#editItems');function addEditRow(item){let opts=products.filter(p=>p.active||item?.productId===p.id).map(p=>`<option value="${p.id}" ${(item?.productId===p.id)?'selected':''}>${esc(p.name)} (${money(p.price)})</option>`).join('');itemBox.insertAdjacentHTML('beforeend',`<div class="item"><select class="ip">${opts}</select><input class="iq" type="number" min="1" step="1" required value="${Number(item?.qty||1)}"><input class="iv" type="number" min="0" step=".01" required value="${Number(item?.price||0)}"><button type="button" class="alt remove">×</button></div>`);let row=itemBox.lastElementChild;row.querySelector('.ip').onchange=()=>{row.querySelector('.iv').value=pBy(row.querySelector('.ip').value)?.price||0;updateEditTotal()};row.querySelector('.iq').oninput=updateEditTotal;row.querySelector('.iv').oninput=updateEditTotal;row.querySelector('.remove').onclick=()=>{if(itemBox.children.length>1){row.remove();updateEditTotal()}}}
function editItems(){return [...itemBox.querySelectorAll('.item')].map(r=>{let p=pBy(r.querySelector('.ip').value);return {productId:p.id,name:p.name,sku:p.sku,qty:Number(r.querySelector('.iq').value),price:Number(r.querySelector('.iv').value)}})}function calcEditTotal(){let its=isAdmin?editItems():o.items;return its.reduce((sum,i)=>sum+Number(i.qty||0)*Number(i.price||0),0)+Number($('#edit [name="delivery_fee"]')?.value??o.delivery_fee??0)-Number($('#edit [name="discount"]')?.value??o.discount??0)}function updateEditTotal(){let t=Math.max(0,calcEditTotal()),a=Number($('#edit [name="paid_amount"]').value||0);$('#editTotal').textContent=`Order total: ${money(t)} · Outstanding: ${money(Math.max(0,t-a))}`}
if(isAdmin){(o.items||[]).forEach(addEditRow);$('#editAddItem').onclick=()=>addEditRow({productId:products.find(p=>p.active)?.id,qty:1,price:products.find(p=>p.active)?.price||0});['delivery_fee','discount','paid_amount'].forEach(n=>$('#edit [name="'+n+'"]').oninput=updateEditTotal)}
$('#edit').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),patch={delivery_status:f.get('delivery_status'),delivery_proof_url:String(f.get('delivery_proof_url')||'').trim()||null,paid_amount:Math.max(0,Number(f.get('paid_amount')||0)),payment_method:f.get('payment_method'),delivery_remark:f.get('delivery_remark'),notes:f.get('notes'),history:[...(o.history||[]),{date:new Date().toISOString(),text:(isAdmin?'Order edited':'Delivery/payment updated')+' by '+me.full_name}]};if(isAdmin){patch.delivery_proof_url=String(f.get('delivery_proof_url')||'').trim()||null;patch.customer=String(f.get('customer')).trim();patch.phone=String(f.get('phone')).trim();patch.order_date=f.get('order_date');patch.address=String(f.get('address')).trim();patch.area=String(f.get('area')||'').trim();patch.assigned_fe=f.get('assigned_fe')||null;patch.items=editItems();patch.delivery_fee=Math.max(0,Number(f.get('delivery_fee')||0));patch.discount=Math.max(0,Number(f.get('discount')||0))}let gross=isAdmin?Math.max(0,patch.items.reduce((sum,i)=>sum+i.qty*i.price,0)+patch.delivery_fee-patch.discount):total(o);if(patch.paid_amount>gross){alert('Collected amount cannot exceed the order total ('+money(gross)+').');return}patch.payment_status=patch.paid_amount>=gross?'Paid':patch.paid_amount>0?'Partially Paid':'Pending';if(patch.delivery_status==='Delivered'&&!o.delivered_at)patch.delivered_at=new Date().toISOString();const r=await sb.from('oms_orders').update(patch).eq('id',o.id);if(r.error){alert('Could not save order: '+r.error.message);return}await sb.from('oms_delivery_events').insert({order_id:o.id,event_type:isAdmin?'Order edited':'Delivery/payment updated',notes:'Updated by '+me.full_name+' — status: '+patch.delivery_status+', payment: '+patch.payment_status,created_by:authUser.id});m.remove();await refresh();render()}}

function productDialog(id){let p=id?pBy(id):{name:'',sku:'',price:0,cost_price:0,stock:0},m=modal(id?'Edit product':'Add product',`<form id="prod"><div class="field"><label>Name</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>SKU</label><input name="sku" required value="${esc(p.sku)}"></div><div class="formgrid"><div class="field"><label>Sale price</label><input name="price" type="number" min="0" step=".01" required value="${p.price}"></div><div class="field"><label>Unit cost</label><input name="cost_price" type="number" min="0" step=".01" required value="${p.cost_price||0}"></div><div class="field"><label>Stock</label><input name="stock" type="number" min="0" required value="${p.stock}"></div></div><button>Save product</button></form>`);$('#prod').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),data={name:f.get('name').trim(),sku:f.get('sku').trim(),price:Number(f.get('price')),cost_price:Number(f.get('cost_price')||0),stock:Number(f.get('stock'))};let r=id?await sb.from('oms_products').update(data).eq('id',id):await sb.from('oms_products').insert(data);if(r.error){alert(r.error.message);return}m.remove();await refresh();render()}}
function stockDialog(id){let p=pBy(id),m=modal('Adjust stock',`<p>${esc(p.name)} current stock: ${p.stock}</p><form id="stock"><div class="field"><label>Change (+/-)</label><input name="change" type="number" required></div><div class="field"><label>Reason</label><input name="reason" required></div><button>Save adjustment</button></form>`);$('#stock').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),n=Number(f.get('change'));if(p.stock+n<0)return alert('Stock cannot be negative');let r=await sb.from('oms_products').update({stock:p.stock+n}).eq('id',id);if(r.error)return alert(r.error.message);await sb.from('oms_stock_log').insert({product_id:id,product_name:p.name,quantity_change:n,reason:f.get('reason'),created_by:authUser.id});m.remove();await refresh();render()}}
function feDialog(){let m=modal('Create FE account',`<form id="fe"><div class="field"><label>Full name *</label><input name="full_name" required></div><div class="field"><label>Work email *</label><input name="email" type="email" required></div><div class="field"><label>Username (reference only)</label><input name="username"></div><div class="field"><label>Temporary password (min. 8 characters)</label><input name="password" type="password" minlength="8" required></div><div id="feErr"></div><button id="createFE">Create FE</button><p class="footnote">Send temporary credentials securely. The password is not saved in the OMS database.</p></form>`);$('#fe').onsubmit=async e=>{e.preventDefault();$('#createFE').disabled=true;let f=new FormData(e.target),r=await sb.functions.invoke('oms-create-fe',{body:{full_name:f.get('full_name').trim(),email:f.get('email').trim(),username:f.get('username').trim(),password:f.get('password')}});if(r.error||r.data?.error){$('#feErr').innerHTML=`<div class="error">${esc(r.data?.error||r.error.message)}</div>`;$('#createFE').disabled=false;return}alert('FE account created.');m.remove();await refresh();render()}}
function csv(){const rows=[['Order ID','Date','Customer','Phone','Address','Area','Products','Order Value','Delivery Fee','Discount','Collected','Balance','FE','Delivery Status','Payment Status','Payment Method','Remarks']];visOrders().forEach(o=>rows.push([o.order_no,o.order_date,o.customer,o.phone,o.address,o.area,(o.items||[]).map(i=>i.name+' x'+i.qty+' @ '+i.price).join('; '),total(o),Number(o.delivery_fee||0),Number(o.discount||0),paid(o),balance(o),staff.find(u=>u.id===o.assigned_fe)?.name||'',o.delivery_status,o.payment_status,o.payment_method,o.delivery_remark||o.notes||'']));const content='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');try{const blob=new Blob([content],{type:'text/csv;charset=utf-8'});const url=window.URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vermiveda_orders_'+today()+'.csv';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>window.URL.revokeObjectURL(url),1500)}catch(err){const data='data:text/csv;charset=utf-8,'+encodeURIComponent(content);const a=document.createElement('a');a.href=data;a.download='vermiveda_orders_'+today()+'.csv';document.body.appendChild(a);a.click();a.remove()}}

function customersPage(){let a=visOrders(),map=new Map();a.forEach(o=>{let key=String(o.phone||'').replace(/\D/g,'')||String(o.customer||'').toLowerCase();if(!map.has(key))map.set(key,{name:o.customer,phone:o.phone,address:o.address,area:o.area,orders:[],spent:0,last:o.order_date});let x=map.get(key);x.orders.push(o);x.spent+=total(o);if(String(o.order_date)>String(x.last))x.last=o.order_date});let rows=[...map.values()].sort((x,y)=>String(y.last).localeCompare(String(x.last)));return `<div class="head"><div><h2>Customer book</h2><p class="muted">Automatically built from saved orders — no duplicate customer entry.</p></div><span class="pill green">${rows.length} customers</span></div><div class="panel"><div class="toolbar"><input id="customerSearch" placeholder="Search name, phone or area"></div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Contact</th><th>Area</th><th>Orders</th><th>Lifetime value</th><th>Last order</th><th>Quick action</th></tr></thead><tbody id="customerRows">${rows.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.address||'')}</div></td><td>${esc(x.phone||'')}</td><td>${esc(x.area||'—')}</td><td>${x.orders.length}</td><td><b>${money(x.spent)}</b></td><td>${esc(x.last||'—')}</td><td><div class="actions"><a href="tel:${esc(String(x.phone||'').replace(/[^+\d]/g,''))}"><button type="button" class="alt">Call</button></a><a target="_blank" rel="noopener" href="https://wa.me/${String(x.phone||'').replace(/\D/g,'')}"><button type="button">WhatsApp</button></a></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No customer history yet.</td></tr>'}</tbody></table></div></div>`}
function deliveryPage(){let a=visOrders().filter(o=>!['Delivered','Cancelled','Returned'].includes(o.delivery_status));return `<div class="head"><div><h2>Delivery control</h2><p class="muted">Live worklist for assigned and pending deliveries.</p></div><span class="pill orange">${a.length} open deliveries</span></div><div class="stats">${stat('Assigned',a.filter(o=>o.delivery_status==='Assigned').length,'Ready to dispatch')}${stat('On the way',a.filter(o=>o.delivery_status==='Out for Delivery').length,'With field team')}${stat('Failed',visOrders().filter(o=>o.delivery_status==='Failed').length,'Need follow-up')}${stat('Delivered today',visOrders().filter(o=>o.delivery_status==='Delivered'&&o.delivered_at?.slice(0,10)===today()).length,'Completed today')}</div><div class="panel"><h3>Recent delivery activity</h3>${deliveryEvents.length?`<div class="tablewrap"><table><tr><th>Time</th><th>Order</th><th>Event</th><th>Notes</th></tr>${deliveryEvents.slice(0,12).map(e=>`<tr><td>${esc(e.created_at?.replace('T',' ').slice(0,16))}</td><td>${esc(orders.find(o=>o.id===e.order_id)?.order_no||'')}</td><td>${esc(e.event_type)}</td><td>${esc(e.notes||'')}</td></tr>`).join('')}</table></div>`:'<div class="empty">No delivery events recorded yet.</div>'}</div><div class="panel"><div class="toolbar"><input id="deliverySearch" placeholder="Search order, customer, phone"><select id="deliveryFilter"><option value="">All open statuses</option><option>New</option><option>Assigned</option><option>Out for Delivery</option><option>Failed</option></select></div><div id="deliveryRows">${ordersTable(a)}</div></div>`}

function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openOrder(b.dataset.edit));if($('#newOrder')){if(!products.filter(p=>p.active).length){$('#items').innerHTML='<div class="error">Add products in Inventory first.</div>';return}const rows=$('#items');function wire(r){let s=r.querySelector('.ip'),v=r.querySelector('.iv');const price=()=>v.value=pBy(s.value)?.price||0;s.onchange=price;price();r.querySelector('.remove').onclick=()=>{if(rows.children.length>1)r.remove()}}rows.innerHTML=itemRow();wire(rows.firstElementChild);$('#addItem').onclick=()=>{rows.insertAdjacentHTML('beforeend',itemRow());wire(rows.lastElementChild)};$('#newOrder').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),items=[...rows.querySelectorAll('.item')].map(r=>{let p=pBy(r.querySelector('.ip').value);return {productId:p.id,name:p.name,sku:p.sku,qty:Number(r.querySelector('.iq').value),price:Number(r.querySelector('.iv').value)}}),gross=items.reduce((s,i)=>s+i.qty*i.price,0)+Number(f.get('delivery_fee')||0)-Number(f.get('discount')||0),amount=Math.max(0,Math.min(Number(f.get('paid_amount')||0),gross)),data={order_no:'VV-'+Date.now().toString().slice(-8),customer:f.get('customer').trim(),phone:f.get('phone').trim(),order_date:f.get('order_date'),address:f.get('address').trim(),area:f.get('area').trim(),assigned_fe:f.get('assigned_fe')||null,payment_method:f.get('payment_method'),items,delivery_fee:Number(f.get('delivery_fee')||0),discount:Number(f.get('discount')||0),paid_amount:amount,notes:f.get('notes').trim(),delivery_status:f.get('assigned_fe')?'Assigned':'New',payment_status:amount>=gross?'Paid':amount>0?'Partially Paid':'Pending',created_by:authUser.id,history:[{date:new Date().toISOString(),text:'Order created'}]};let r=await sb.from('oms_orders').insert(data).select('id').single();if(r.error)return alert('Save failed: '+r.error.message);if(r.data?.id)await sb.from('oms_delivery_events').insert({order_id:r.data.id,event_type:'Order created',notes:'Created by '+me.full_name,created_by:authUser.id});await refresh();go('orders')}}
if($('#billSearch'))$('#billSearch').oninput=()=>{let q=$('#billSearch').value.toLowerCase();$('#billRows').querySelectorAll('tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')};document.querySelectorAll('[data-bill]').forEach(b=>b.onclick=()=>openBill(b.dataset.bill));document.querySelectorAll('[data-wa-bill]').forEach(b=>b.onclick=()=>shareBill(b.dataset.waBill));if($('#customerSearch'))$('#customerSearch').oninput=()=>{let q=$('#customerSearch').value.toLowerCase();$('#customerRows').querySelectorAll('tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')};if($('#deliverySearch')){let updateDelivery=()=>{let q=$('#deliverySearch').value.toLowerCase(),s=$('#deliveryFilter').value,l=visOrders().filter(o=>!['Delivered','Cancelled','Returned'].includes(o.delivery_status)&&(!q||[o.order_no,o.customer,o.phone,o.area].join(' ').toLowerCase().includes(q))&&(!s||o.delivery_status===s));$('#deliveryRows').innerHTML=ordersTable(l);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openOrder(b.dataset.edit))};$('#deliverySearch').oninput=updateDelivery;$('#deliveryFilter').onchange=updateDelivery}if($('#search')){let update=()=>{let q=$('#search').value.toLowerCase(),s=$('#filter').value,l=visOrders().filter(o=>(!q||[o.order_no,o.customer,o.phone,o.area].join(' ').toLowerCase().includes(q))&&(!s||o.delivery_status===s));$('#orderRows').innerHTML=ordersTable(l);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openOrder(b.dataset.edit))};$('#search').oninput=update;$('#filter').onchange=update}if($('#addProduct'))$('#addProduct').onclick=()=>productDialog();if($('#addExpense'))$('#addExpense').onclick=expenseDialog;document.querySelectorAll('[data-prod]').forEach(b=>b.onclick=()=>productDialog(b.dataset.prod));document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>stockDialog(b.dataset.stock));if($('#addFE'))$('#addFE').onclick=feDialog;if($('#csv'))$('#csv').onclick=csv;documen
