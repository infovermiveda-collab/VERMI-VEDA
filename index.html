/* Vermi Veda modern OMS refresh */
:root{--g:#16734a;--d:#0c3828;--p:#e9f5ed;--ink:#17251d;--m:#718077;--line:#e4ece6;--bg:#f4f8f5;--surface:#fff;--shadow:0 10px 28px rgba(20,60,38,.07)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button{border-radius:11px;padding:10px 15px;box-shadow:0 2px 5px #0c382812;transition:transform .15s,box-shadow .15s,background .15s}
button:hover{transform:translateY(-1px);box-shadow:0 7px 18px #0c38281c}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
button.alt{background:#f2f7f3;color:#254b35;border:1px solid #dfeae2;box-shadow:none}
input,select,textarea{border-color:#dce8df;border-radius:10px;padding:11px 12px;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:#57a879;box-shadow:0 0 0 3px #57a87922}
.loginwrap{background:radial-gradient(circle at 15% 10%,#d5eddd 0,transparent 35%),linear-gradient(135deg,#f4faf5,#e8f3eb)}
.login{border:1px solid #e0ebe3;border-radius:24px;padding:34px;box-shadow:0 24px 70px #123d241c}
.login h1{letter-spacing:-.7px;color:var(--d)}
.shell{grid-template-columns:252px minmax(0,1fr);background:var(--bg)}
.side{background:linear-gradient(180deg,#103f2d,#0a3022);padding:25px 17px;gap:22px;box-shadow:8px 0 30px #0b3a2410}
.brand{font-size:20px;letter-spacing:-.5px;padding:6px 9px 22px;border-bottom:1px solid #ffffff24}
.brand:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#8bd3a3;margin:0 8px 1px 0;box-shadow:0 0 0 5px #8bd3a31c}
.brand small{padding:5px 0 0 18px;color:#c0ddc9;letter-spacing:.2px}
.nav{gap:7px}
.nav button{border-radius:12px;padding:12px 13px;color:#d4e8da;font-weight:600;box-shadow:none}
.nav button.active,.nav button:hover{background:#ffffff19;color:#fff;box-shadow:inset 3px 0 #8bd3a3;transform:none}
.top{position:sticky;top:0;z-index:10;padding:17px 28px;background:#ffffffed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top h1{font-size:21px;letter-spacing:-.55px;color:var(--d)}
.top p{color:#819087}
.content{max-width:1500px;padding:27px 30px}
.head{margin-bottom:18px}
.head h2,.panel h3{letter-spacing:-.4px;color:#173b29}
.panel,.stat{border:1px solid #e5eee7;border-radius:17px;box-shadow:var(--shadow);padding:19px}
.panel{margin-bottom:18px}
.stats{gap:15px;margin-bottom:20px}
.stat{position:relative;overflow:hidden;min-height:116px;padding:19px 20px}
.stat:after{content:"";position:absolute;right:-22px;top:-26px;width:90px;height:90px;border-radius:50%;background:var(--p)}
.stat small{position:relative;z-index:1;color:#718077}
.stat b{position:relative;z-index:1;font-size:27px;letter-spacing:-.8px;color:var(--d);margin:9px 0}
.notice{border:1px solid #d5eadb;background:linear-gradient(110deg,#eef8f0,#f8fbf8);color:#285b3c;border-radius:13px;padding:14px 16px}
.tablewrap{border:1px solid #e5eee7;border-radius:13px}
table{border-spacing:0;min-width:760px}
th{background:#f5f9f6;color:#718077;font-size:10px;letter-spacing:.7px;padding:13px}
td{padding:13px 12px;border-bottom:1px solid #edf2ee}
tbody tr:hover{background:#f8fbf8}
.pill{padding:5px 9px;border-radius:999px;letter-spacing:.1px}
.green{background:#e3f5e9;color:#187044}.orange{background:#fff3dd;color:#9a620d}.red{background:#ffedeb;color:#b13d35}
.toolbar{gap:10px}
.toolbar input,.toolbar select{border-radius:11px}
.field{gap:7px;margin:13px 0}
.field label{font-size:11px;letter-spacing:.35px;text-transform:uppercase;color:#6c7c71}
.item{gap:9px}
.empty{padding:34px}
#modal>div{border:1px solid #e5eee7;border-radius:20px;box-shadow:0 30px 90px #061d12a0}
.actions button{border-radius:9px}
.footnote{line-height:1.6}
@media(max-width:850px){.shell{grid-template-columns:1fr}.side{padding:12px 13px;gap:10px}.brand{padding:3px 6px 10px}.brand small{display:inline;padding-left:7px}.nav{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.nav button{font-size:11px;padding:9px 3px}.top{padding:13px 16px}.content{padding:16px}.panel,.stat{padding:14px}.stats{gap:9px}}
@media(max-width:520px){.top{align-items:flex-start}.top>div:last-child{font-size:11px}.top>div:last-child button{padding:7px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{min-height:100px}.stat b{font-size:22px}.head{gap:8px}.head h2{font-size:18px}}

</style></head><body><div id="app"></div><script>
function showOmsFatal(message){
  document.body.innerHTML = `<main style="font:16px/1.5 Arial,sans-serif;max-width:680px;margin:8vh auto;padding:24px;color:#1e2a23"><h1 style="color:#176b45">Vermi Veda OMS</h1><h2>Page could not start</h2><p>${String(message||'Unknown error').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</p><p>Refresh this page. If the issue continues, open Chrome DevTools with <b>Ctrl + Shift + J</b> and share a screenshot of the Console tab.</p><button onclick="location.reload()" style="background:#176b45;color:white;border:0;padding:10px 16px;border-radius:8px;cursor:pointer">Reload OMS</button></main>`;
}
window.addEventListener('error', function(e){ if(e && e.message) showOmsFatal('JavaScript error: '+e.message); });
window.addEventListener('unhandledrejection', function(e){ showOmsFatal('Unexpected app error: '+(e.reason?.message||e.reason||'Unknown error')); });
async function loadSupabaseLibrary(){
  if(window.supabase && typeof window.supabase.createClient==='function') return;
  const urls=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'];
  for(const url of urls){
    try { await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=url;script.onload=()=>window.supabase&&typeof window.supabase.createClient==='function'?resolve():reject(new Error('Supabase library did not initialize'));script.onerror=()=>reject(new Error('Could not load '+url));document.head.appendChild(script);}); return; }
    catch(e) { /* try the alternate CDN */ }
  }
  throw new Error('Could not load the Supabase JavaScript library. Check your internet connection or allow cdn.jsdelivr.net / unpkg.com, then reload.');
}
loadSupabaseLibrary().then(()=>bootOms()).catch(e=>showOmsFatal(e.message));
function bootOms(){
// Supabase-connected OMS. This is the public publishable key; never put a service-role key in browser code.
const URL='https://ezozfdekhjdklioelgno.supabase.co', KEY='sb_publishable_yAZ3eafe2O8p4Pvjm0mjTA_I6lMTkwP';
const sb=window.supabase.createClient(URL,KEY);let authUser=null,me=null,products=[],orders=[],staff=[],stocklog=[],expenses=[],page='dashboard';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),today=()=>new Date().toISOString().slice(0,10),admin=()=>me?.role==='admin',paid=o=>Number(o.paid_amount||0),total=o=>(o.items||[]).reduce((s,i)=>s+Number(i.qty||0)*Number(i.price||0),0)+Number(o.delivery_fee||0)-Number(o.discount||0),balance=o=>Math.max(0,total(o)-paid(o)),pBy=id=>products.find(p=>p.id===id),visOrders=()=>admin()?orders:orders.filter(o=>o.assigned_fe===authUser.id),status=s=>`<span class="pill ${['Delivered','Paid','Active'].includes(s)?'green':['Assigned','Out for Delivery','Partially Paid'].includes(s)?'orange':['Failed','Cancelled','Returned','Inactive'].includes(s)?'red':''}">${esc(s||'Pending')}</span>`;
function login(message=''){document.body.innerHTML=`<div id="app"><div class="loginwrap"><form class="login" id="login"><div style="font-size:30px">🌱</div><h1>Vermi Veda OMS</h1><p>Order management & field delivery portal</p><div class="field"><label>Work email</label><input name="email" type="email" required autocomplete="username" placeholder="name@company.com"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button id="signIn">Sign in securely</button>${message?`<div class="error">${esc(message)}</div>`:''}<div class="footnote">Staff accounts are created by the Admin. Public registration is not available.</div><div id="err" class="error" style="display:none"></div></form></div></div>`;$('#login').onsubmit=async e=>{e.preventDefault();$('#signIn').disabled=true;const f=new FormData(e.target),r=await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('password'))});if(r.error){$('#err').style.display='block';$('#err').textContent=r.error.message;$('#signIn').disabled=false;return}await start(r.data.user)}}
async function start(user){authUser=user;const r=await sb.from('oms_profiles').select('user_id,full_name,role,active').eq('user_id',user.id).single();if(r.error||!r.data){await sb.auth.signOut();authUser=null;return login('Profile not configured. Ask the administrator to set up your account.')}me=r.data;if(!me.active){await sb.auth.signOut();authUser=null;return login('Your account is inactive. Contact the administrator.')}try{await refresh();page='dashboard';render()}catch(e){login('Database error: '+e.message)}}
async function refresh(){const [p,o,u]=await Promise.all([sb.from('oms_products').select('*').order('name'),sb.from('oms_orders').select('*').order('created_at',{ascending:false}),sb.from('oms_profiles').select('user_id,full_name,role,active').order('full_name')]);if(p.error)throw p.error;if(o.error)throw o.error;if(u.error)throw u.error;products=p.data||[];orders=o.data||[];staff=(u.data||[]).map(x=>({...x,id:x.user_id,name:x.full_name}));if(admin()){const [l,x]=await Promise.all([sb.from('oms_stock_log').select('*').order('created_at',{ascending:false}).limit(100),sb.from('oms_expenses').select('*').order('expense_date',{ascending:false}).limit(500)]);stocklog=l.data||[];expenses=x.data||[]}}
const nav=[['dashboard','◈  Dashboard'],['orders','▤  Orders'],['new','＋  New Order'],['delivery','↗  Delivery'],['customers','♙  Customers'],['inventory','▦  Inventory'],['expenses','₹  Expenses'],['payments','₹  Payments'],['reports','▥  Reports'],['team','♧  FE & Users']];function go(p){page=p;render()}function render(){if(!authUser||!me)return login();if(!admin()&&!['dashboard','orders','payments','delivery','customers'].includes(page))page='dashboard';document.body.innerHTML=`<div id="app"><div class="shell"><aside class="side"><div class="brand">🌱 Vermi Veda<small>Order Management</small></div><div class="nav">${nav.filter(n=>admin()||['dashboard','orders','payments'].includes(n[0])).map(n=>`<button class="${page===n[0]?'active':''}" data-page="${n[0]}">${n[1]}</button>`).join('')}</div><small>Shared Supabase database</small></aside><main><header class="top"><div><h1>${nav.find(n=>n[0]===page)?.[1]||'Dashboard'}</h1><p>Shared order-to-delivery tracking</p></div><div><b>${esc(me.full_name||authUser.email)}</b> · ${admin()?'Admin':'Field Executive'} <button class="alt" id="logout">Log out</button></div></header><div class="content" id="content"></div></main></div></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#logout').onclick=async()=>{await sb.auth.signOut();authUser=me=null;login()};draw()}
function stat(label,n,sub){return `<div class="stat"><small>${label}</small><b>${n}</b><small>${sub||''}</small></div>`}function draw(){let c=$('#content');if(page==='dashboard')c.innerHTML=dashboard();if(page==='orders')c.innerHTML=ordersPage();if(page==='new')c.innerHTML=orderForm();if(page==='inventory')c.innerHTML=inventoryPage();if(page==='expenses')c.innerHTML=expensesPage();if(page==='payments')c.innerHTML=paymentsPage();if(page==='reports')c.innerHTML=reportsPage();if(page==='team')c.innerHTML=teamPage();if(page==='customers')c.innerHTML=customersPage();if(page==='delivery')c.innerHTML=deliveryPage();bind()}
function dashboard(){let a=visOrders();return `<div class="notice">${admin()?'Enter WhatsApp orders, assign FEs, and track stock and collections.':'You can see only orders assigned to your account. Update delivery and payment after completing each order.'}</div><div class="stats">${stat('Total orders',a.length,'Visible orders')}${stat('Pending delivery',a.filter(o=>!['Delivered','Cancelled','Returned'].includes(o.delivery_status)).length,'Need action')}${stat('Delivered sales',money(a.filter(o=>o.delivery_status==='Delivered').reduce((s,o)=>s+total(o),0)),'Delivered order value')}${stat('Collected',money(a.reduce((s,o)=>s+paid(o),0)),'Recorded collections')}</div><div class="panel"><div class="head"><h3>Recent orders</h3><button class="alt" data-go="orders">View orders</button></div>${ordersTable(a.slice(0,8))}</div>${admin()?'<div class="actions"><button data-go="new">＋ Enter WhatsApp order</button><button class="alt" data-go="team">Manage FE accounts</button></div>':''}`}
function ordersTable(list){if(!list.length)return '<div class="empty">No orders found.</div>';return `<div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>FE</th><th>Delivery</th><th>Payment</th><th>Actions</th></tr></thead><tbody>${list.map(o=>`<tr><td><b>${esc(o.order_no)}</b><div class="muted">${esc(o.order_date)}</div></td><td>${esc(o.customer)}<div class="muted">${esc(o.phone)}</div></td><td>${(o.items||[]).map(i=>`${esc(i.name)} × ${i.qty}`).join('<br>')}</td><td>${money(total(o))}</td><td>${esc(staff.find(u=>u.id===o.assigned_fe)?.name||'Unassigned')}</td><td>${status(o.delivery_status)}</td><td>${status(o.payment_status)}<div class="muted">${money(paid(o))} collected</div></td><td><div class="actions"><a href="tel:${esc(String(o.phone||'').replace(/[^+\d]/g,''))}" style="text-decoration:none"><button type="button" class="alt">☎ Call</button></a><button class="alt" data-edit="${o.id}">${admin()?'Edit':'Open'}</button></div></td></tr>`).join('')}</tbody></table></div>`}
function ordersPage(){return `<div class="head"><div><h2>Order register</h2><p class="muted">Search orders and update delivery or collection.</p></div>${admin()?'<button data-go="new">＋ New order</button>':''}</div><div class="panel"><div class="toolbar"><input id="search" placeholder="Search order, customer, phone"><select id="filter"><option value="">All statuses</option>${['New','Assigned','Out for Delivery','Delivered','Failed','Cancelled','Returned'].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="orderRows">${ordersTable(visOrders())}</div></div>`}
function orderForm(){return `<div class="panel"><h2>Enter WhatsApp order</h2><form id="newOrder"><div class="formgrid"><div class="field"><label>Customer *</label><input name="customer" required></div><div class="field"><label>Phone *</label><input name="phone" required></div><div class="field"><label>Order date</label><input name="order_date" type="date" value="${today()}" required></div><div class="field span2"><label>Address *</label><textarea name="address" required></textarea></div><div class="field"><label>Area</label><input name="area"></div><div class="field"><label>Assign FE</label><select name="assigned_fe"><option value="">Unassigned</option>${staff.filter(u=>u.role==='fe'&&u.active).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>Payment method</label><select name="payment_method"><option>Cash</option><option>UPI</option><option>Online prepaid</option><option>Other</option></select></div><div class="field span3"><label>Products *</label><div id="items"></div><button type="button" class="alt" id="addItem">＋ Add product</button></div><div class="field"><label>Delivery fee</label><input name="delivery_fee" type="number" min="0" value="0"></div><div class="field"><label>Discount</label><input name="discount" type="number" min="0" value="0"></div><div class="field"><label>Advance paid</label><input name="paid_amount" type="number" min="0" value="0"></div><div class="field span3"><label>Notes</label><textarea name="notes"></textarea></div></div><p class="formactions"><button type="button" class="alt" data-go="orders">Cancel</button> <button>Save to shared database</button></p></form></div>`}
function itemRow(){return `<div class="item"><select class="ip">${products.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)} (${money(p.price)})</option>`).join('')}</select><input class="iq" type="number" min="1" value="1" required><input class="iv" type="number" min="0" step=".01" required><button type="button" class="alt remove">×</button></div>`}
function inventoryPage(){return `<div class="head"><div><h2>Inventory</h2><p class="muted">Products and stock are saved in Supabase.</p></div><button id="addProduct">＋ Add product</button></div><div class="panel"><div id="productRows">${productTable()}</div></div><div class="panel"><h3>Stock movement log</h3>${stocklog.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Product</th><th>Change</th><th>Reason</th></tr>${stocklog.map(x=>`<tr><td>${esc(x.created_at?.slice(0,10))}</td><td>${esc(x.product_name)}</td><td>${x.quantity_change>0?'+':''}${x.quantity_change}</td><td>${esc(x.reason)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No stock movements.</div>'}</div>`}function productTable(){return `<div class="tablewrap"><table><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Action</th></tr>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><div class="actions"><button class="alt" data-stock="${p.id}">Adjust stock</button><button class="alt" data-prod="${p.id}">Edit</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No products yet.</td></tr>'}</table></div>`}
function paymentsPage(){let a=visOrders();return `<div class="stats">${stat('Order value',money(a.reduce((s,o)=>s+total(o),0)),'Visible orders')}${stat('Collected',money(a.reduce((s,o)=>s+paid(o),0)),'Recorded')}${stat('Outstanding',money(a.reduce((s,o)=>s+balance(o),0)),'Balance due')}${stat('Orders',a.length,'Visible orders')}</div><div class="panel">${ordersTable(a)}</div>`}
function reportsPage(){let d=orders.filter(o=>o.delivery_status==='Delivered');return `<div class="head"><h2>Reports</h2><button id="csv">Download Report (Excel/CSV)</button></div><div class="stats">${stat('Orders today',orders.filter(o=>o.order_date===today()).length,'Today')}${stat('Delivered',d.length,'All time')}${stat('Delivered sales',money(d.reduce((s,o)=>s+total(o),0)),'Order value')}${stat('Outstanding',money(orders.reduce((s,o)=>s+balance(o),0)),'All orders')}</div><div class="panel"><h3>FE-wise performance</h3><div class="tablewrap"><table><tr><th>FE</th><th>Assigned</th><th>Delivered</th><th>Collected</th></tr>${staff.filter(u=>u.role==='fe').map(u=>{let a=orders.filter(o=>o.assigned_fe===u.id);return `<tr><td>${esc(u.name)}</td><td>${a.length}</td><td>${a.filter(o=>o.delivery_status==='Delivered').length}</td><td>${money(a.reduce((s,o)=>s+paid(o),0))}</td></tr>`}).join('')}</table></div></div>`}

function expensesPage(){
 let sum=expenses.reduce((s,x)=>s+Number(x.amount||0),0);
 let html='<div class="head"><div><h2>Business expenses</h2><p class="muted">Fuel, delivery, packaging, marketing and operating costs.</p></div><button id="addExpense">＋ Add expense</button></div>';
 html+='<div class="stats">'+stat('Recorded expenses',money(sum),'Total in current list')+stat('Entries',expenses.length,'Expense records')+'</div><div class="panel"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead><tbody>';
 expenses.forEach(x=>{html+='<tr><td>'+esc(x.expense_date)+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.description||'—')+'</td><td><b>'+money(x.amount)+'</b></td></tr>'});
 return html+'</tbody></table></div></div>';
}
function expenseDialog(){
 let html='<form id="expenseForm"><div class="field"><label>Date</label><input name="expense_date" type="date" value="'+today()+'" required></div><div class="field"><label>Category</label><select name="category"><option>Delivery / Fuel</option><option>Packaging</option><option>Marketing / Ads</option><option>Salary / Labour</option><option>Returns / RTO</option><option>Office / Utilities</option><option>Other</option></select></div><div class="field"><label>Amount</label><input name="amount" type="number" min="0.01" step=".01" required></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><button>Save expense</button></form>';
 modal('Add business expense',html);
 $('#expenseForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let r=await sb.from('oms_expenses').insert({expense_date:f.get('expense_date'),category:f.get('category'),amount:Number(f.get('amount')),description:String(f.get('description')||'').trim(),created_by:authUser.id});if(r.error)return alert(r.error.message);$('#modal').remove();await refresh();render()};
}

function teamPage(){return `<div class="head"><div><h2>FE & Users</h2><p class="muted">Create FE accounts securely through Supabase Auth.</p></div><button id="addFE">＋ Add FE</button></div><div class="notice">Passwords are handled by Supabase Auth, not stored in browser storage.</div><div class="panel"><div class="tablewrap"><table><tr><th>Name</th><th>Role</th><th>Status</th><th>Account</th><th>Action</th></tr>${staff.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${status(u.active?'Active':'Inactive')}</td><td>${esc(u.id)}</td><td>${u.id===authUser.id?'Current account':`<button class="alt" data-toggle="${u.id}" data-active="${u.active}">${u.active?'Deactivate':'Activate'}</button>`}</td></tr>`).join('')}</table></div></div>`}
function modal(title,body){$('#modal')?.remove();document.body.insertAdjacentHTML('beforeend',`<div id="modal" style="position:fixed;inset:0;background:#0d2017a8;display:grid;place-items:center;padding:16px;z-index:99"><div style="background:white;border-radius:14px;padding:22px;width:min(580px,100%);max-height:90vh;overflow:auto"><div class="head"><h3>${title}</h3><button class="alt" id="close">×</button></div>${body}</div></div>`);$('#close').onclick=()=>$('#modal').remove();return $('#modal')}
function openOrder(id){let o=orders.find(x=>x.id===id);if(!o)return;const isAdmin=admin();let m=modal((isAdmin?'Edit order ':'Order ')+esc(o.order_no),`<form id="edit"><div class="formgrid"><div class="field"><label>Customer *</label><input name="customer" value="${esc(o.customer)}" ${isAdmin?'required':'disabled'}></div><div class="field"><label>Phone *</label><input name="phone" value="${esc(o.phone)}" ${isAdmin?'required':'disabled'}></div><div class="field"><label>Order date</label><input name="order_date" type="date" value="${esc(o.order_date)}" ${isAdmin?'required':'disabled'}></div><div class="field span3"><label>Address *</label><textarea name="address" ${isAdmin?'required':'disabled'}>${esc(o.address)}</textarea></div><div class="field"><label>Area</label><input name="area" value="${esc(o.area||'')}" ${isAdmin?'':'disabled'}></div><div class="field"><label>Assigned FE</label><select name="assigned_fe" ${isAdmin?'':'disabled'}><option value="">Unassigned</option>${staff.filter(u=>u.role==='fe'&&u.active).map(u=>`<option value="${u.id}" ${o.assigned_fe===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>Payment method</label><select name="payment_method" ${isAdmin?'':'disabled'}>${['Cash','UPI','Online prepaid','Other'].map(s=>`<option ${o.payment_method===s?'selected':''}>${s}</option>`).join('')}</select></div>${isAdmin?`<div class="field span3"><label>Products and quantities</label><div id="editItems"></div><div class="actions"><button type="button" class="alt" id="editAddItem">＋ Add product</button></div></div><div class="field"><label>Delivery fee</label><input name="delivery_fee" type="number" min="0" step=".01" value="${Number(o.delivery_fee||0)}"></div><div class="field"><label>Discount</label><input name="discount" type="number" min="0" step=".01" value="${Number(o.discount||0)}"></div>`:''}<div class="field"><label>Collected amount</label><input name="paid_amount" type="number" min="0" step=".01" value="${paid(o)}"></div><div class="field"><label>Delivery status</label><select name="delivery_status">${['New','Assigned','Out for Delivery','Delivered','Failed','Cancelled','Returned'].map(s=>`<option ${o.delivery_status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field span2"><label>Delivery remarks</label><textarea name="delivery_remark">${esc(o.delivery_remark||'')}</textarea></div><div class="field span3"><label>Notes</label><textarea name="notes">${esc(o.notes||'')}</textarea></div></div><p class="muted" id="editTotal">Order total: ${money(total(o))} · Outstanding: ${money(balance(o))}</p><button>${isAdmin?'Save order changes':'Save delivery/payment update'}</button></form>`);
const itemBox=$('#editItems');function addEditRow(item){let opts=products.filter(p=>p.active||item?.productId===p.id).map(p=>`<option value="${p.id}" ${(item?.productId===p.id)?'selected':''}>${esc(p.name)} (${money(p.price)})</option>`).join('');itemBox.insertAdjacentHTML('beforeend',`<div class="item"><select class="ip">${opts}</select><input class="iq" type="number" min="1" step="1" required value="${Number(item?.qty||1)}"><input class="iv" type="number" min="0" step=".01" required value="${Number(item?.price||0)}"><button type="button" class="alt remove">×</button></div>`);let row=itemBox.lastElementChild;row.querySelector('.ip').onchange=()=>{row.querySelector('.iv').value=pBy(row.querySelector('.ip').value)?.price||0;updateEditTotal()};row.querySelector('.iq').oninput=updateEditTotal;row.querySelector('.iv').oninput=updateEditTotal;row.querySelector('.remove').onclick=()=>{if(itemBox.children.length>1){row.remove();updateEditTotal()}}}
function editItems(){return [...itemBox.querySelectorAll('.item')].map(r=>{let p=pBy(r.querySelector('.ip').value);return {productId:p.id,name:p.name,sku:p.sku,qty:Number(r.querySelector('.iq').value),price:Number(r.querySelector('.iv').value)}})}function calcEditTotal(){let its=isAdmin?editItems():o.items;return its.reduce((sum,i)=>sum+Number(i.qty||0)*Number(i.price||0),0)+Number($('#edit [name="delivery_fee"]')?.value??o.delivery_fee??0)-Number($('#edit [name="discount"]')?.value??o.discount??0)}function updateEditTotal(){let t=Math.max(0,calcEditTotal()),a=Number($('#edit [name="paid_amount"]').value||0);$('#editTotal').textContent=`Order total: ${money(t)} · Outstanding: ${money(Math.max(0,t-a))}`}
if(isAdmin){(o.items||[]).forEach(addEditRow);$('#editAddItem').onclick=()=>addEditRow({productId:products.find(p=>p.active)?.id,qty:1,price:products.find(p=>p.active)?.price||0});['delivery_fee','discount','paid_amount'].forEach(n=>$('#edit [name="'+n+'"]').oninput=updateEditTotal)}
$('#edit').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),patch={delivery_status:f.get('delivery_status'),paid_amount:Math.max(0,Number(f.get('paid_amount')||0)),payment_method:f.get('payment_method'),delivery_remark:f.get('delivery_remark'),notes:f.get('notes'),history:[...(o.history||[]),{date:new Date().toISOString(),text:(isAdmin?'Order edited':'Delivery/payment updated')+' by '+me.full_name}]};if(isAdmin){patch.customer=String(f.get('customer')).trim();patch.phone=String(f.get('phone')).trim();patch.order_date=f.get('order_date');patch.address=String(f.get('address')).trim();patch.area=String(f.get('area')||'').trim();patch.assigned_fe=f.get('assigned_fe')||null;patch.items=editItems();patch.delivery_fee=Math.max(0,Number(f.get('delivery_fee')||0));patch.discount=Math.max(0,Number(f.get('discount')||0))}let gross=isAdmin?Math.max(0,patch.items.reduce((sum,i)=>sum+i.qty*i.price,0)+patch.delivery_fee-patch.discount):total(o);if(patch.paid_amount>gross){alert('Collected amount cannot exceed the order total ('+money(gross)+').');return}patch.payment_status=patch.paid_amount>=gross?'Paid':patch.paid_amount>0?'Partially Paid':'Pending';const r=await sb.from('oms_orders').update(patch).eq('id',o.id);if(r.error){alert('Could not save order: '+r.error.message);return}m.remove();await refresh();render()}}

function productDialog(id){let p=id?pBy(id):{name:'',sku:'',price:0,stock:0},m=modal(id?'Edit product':'Add product',`<form id="prod"><div class="field"><label>Name</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>SKU</label><input name="sku" required value="${esc(p.sku)}"></div><div class="formgrid"><div class="field"><label>Price</label><input name="price" type="number" min="0" step=".01" required value="${p.price}"></div><div class="field"><label>Stock</label><input name="stock" type="number" min="0" required value="${p.stock}"></div></div><button>Save product</button></form>`);$('#prod').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),data={name:f.get('name').trim(),sku:f.get('sku').trim(),price:Number(f.get('price')),stock:Number(f.get('stock'))};let r=id?await sb.from('oms_products').update(data).eq('id',id):await sb.from('oms_products').insert(data);if(r.error){alert(r.error.message);return}m.remove();await refresh();render()}}
function stockDialog(id){let p=pBy(id),m=modal('Adjust stock',`<p>${esc(p.name)} current stock: ${p.stock}</p><form id="stock"><div class="field"><label>Change (+/-)</label><input name="change" type="number" required></div><div class="field"><label>Reason</label><input name="reason" required></div><button>Save adjustment</button></form>`);$('#stock').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),n=Number(f.get('change'));if(p.stock+n<0)return alert('Stock cannot be negative');let r=await sb.from('oms_products').update({stock:p.stock+n}).eq('id',id);if(r.error)return alert(r.error.message);await sb.from('oms_stock_log').insert({product_id:id,product_name:p.name,quantity_change:n,reason:f.get('reason'),created_by:authUser.id});m.remove();await refresh();render()}}
function feDialog(){let m=modal('Create FE account',`<form id="fe"><div class="field"><label>Full name *</label><input name="full_name" required></div><div class="field"><label>Work email *</label><input name="email" type="email" required></div><div class="field"><label>Username (reference only)</label><input name="username"></div><div class="field"><label>Temporary password (min. 8 characters)</label><input name="password" type="password" minlength="8" required></div><div id="feErr"></div><button id="createFE">Create FE</button><p class="footnote">Send temporary credentials securely. The password is not saved in the OMS database.</p></form>`);$('#fe').onsubmit=async e=>{e.preventDefault();$('#createFE').disabled=true;let f=new FormData(e.target),r=await sb.functions.invoke('oms-create-fe',{body:{full_name:f.get('full_name').trim(),email:f.get('email').trim(),username:f.get('username').trim(),password:f.get('password')}});if(r.error||r.data?.error){$('#feErr').innerHTML=`<div class="error">${esc(r.data?.error||r.error.message)}</div>`;$('#createFE').disabled=false;return}alert('FE account created.');m.remove();await refresh();render()}}
function csv(){const rows=[['Order ID','Date','Customer','Phone','Address','Area','Products','Order Value','Delivery Fee','Discount','Collected','Balance','FE','Delivery Status','Payment Status','Payment Method','Remarks']];visOrders().forEach(o=>rows.push([o.order_no,o.order_date,o.customer,o.phone,o.address,o.area,(o.items||[]).map(i=>i.name+' x'+i.qty+' @ '+i.price).join('; '),total(o),Number(o.delivery_fee||0),Number(o.discount||0),paid(o),balance(o),staff.find(u=>u.id===o.assigned_fe)?.name||'',o.delivery_status,o.payment_status,o.payment_method,o.delivery_remark||o.notes||'']));const content='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');try{const blob=new Blob([content],{type:'text/csv;charset=utf-8'});const url=window.URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vermiveda_orders_'+today()+'.csv';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>window.URL.revokeObjectURL(url),1500)}catch(err){const data='data:text/csv;charset=utf-8,'+encodeURIComponent(content);const a=document.createElement('a');a.href=data;a.download='vermiveda_orders_'+today()+'.csv';document.body.appendChild(a);a.click();a.remove()}}

function customersPage(){let a=visOrders(),map=new Map();a.forEach(o=>{let key=String(o.phone||'').replace(/\D/g,'')||String(o.customer||'').toLowerCase();if(!map.has(key))map.set(key,{name:o.customer,phone:o.phone,address:o.address,area:o.area,orders:[],spent:0,last:o.order_date});let x=map.get(key);x.orders.push(o);x.spent+=total(o);if(String(o.order_date)>String(x.last))x.last=o.order_date});let rows=[...map.values()].sort((x,y)=>String(y.last).localeCompare(String(x.last)));return `<div class="head"><div><h2>Customer book</h2><p class="muted">Automatically built from saved orders — no duplicate customer entry.</p></div><span class="pill green">${rows.length} customers</span></div><div class="panel"><div class="toolbar"><input id="customerSearch" placeholder="Search name, phone or area"></div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Contact</th><th>Area</th><th>Orders</th><th>Lifetime value</th><th>Last order</th><th>Quick action</th></tr></thead><tbody id="customerRows">${rows.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.address||'')}</div></td><td>${esc(x.phone||'')}</td><td>${esc(x.area||'—')}</td><td>${x.orders.length}</td><td><b>${money(x.spent)}</b></td><td>${esc(x.last||'—')}</td><td><div class="actions"><a href="tel:${esc(String(x.phone||'').replace(/[^+\d]/g,''))}"><button type="button" class="alt">Call</button></a><a target="_blank" rel="noopener" href="https://wa.me/${String(x.phone||'').replace(/\D/g,'')}"><button type="button">WhatsApp</button></a></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No customer history yet.</td></tr>'}</tbody></table></div></div>`}
function deliveryPage(){let a=visOrders().filter(o=>!['Delivered','Cancelled','Returned'].includes(o.delivery_status));return `<div class="head"><div><h2>Delivery control</h2><p class="muted">Live worklist for assigned and pending deliveries.</p></div><span class="pill orange">${a.length} open deliveries</span></div><div class="stats">${stat('Assigned',a.filter(o=>o.delivery_status==='Assigned').length,'Ready to dispatch')}${stat('On the way',a.filter(o=>o.delivery_status==='Out for Delivery').length,'With field team')}${stat('Failed',visOrders().filter(o=>o.delivery_status==='Failed').length,'Need follow-up')}${stat('Delivered today',visOrders().filter(o=>o.delivery_status==='Delivered'&&o.delivered_at?.slice(0,10)===today()).length,'Completed today')}</div><div class="panel"><div class="toolbar"><input id="deliverySearch" placeholder="Search order, customer, phone"><select id="deliveryFilter"><option value="">All open statuses</option><option>New</option><option>Assigned</option><option>Out for Delivery</option><option>Failed</option></select></div><div id="deliveryRows">${ordersTable(a)}</div></div>`}

function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openOrder(b.dataset.edit));if($('#newOrder')){if(!products.filter(p=>p.active).length){$('#items').innerHTML='<div class="error">Add products in Inventory first.</div>';return}const rows=$('#items');function wire(r){let s=r.querySelector('.ip'),v=r.querySelector('.iv');const price=()=>v.value=pBy(s.value)?.price||0;s.onchange=price;price();r.querySelector('.remove').onclick=()=>{if(rows.children.length>1)r.remove()}}rows.innerHTML=itemRow();wire(rows.firstElementChild);$('#addItem').onclick=()=>{rows.insertAdjacentHTML('beforeend',itemRow());wire(rows.lastElementChild)};$('#newOrder').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),items=[...rows.querySelectorAll('.item')].map(r=>{let p=pBy(r.querySelector('.ip').value);return {productId:p.id,name:p.name,sku:p.sku,qty:Number(r.querySelector('.iq').value),price:Number(r.querySelector('.iv').value)}}),gross=items.reduce((s,i)=>s+i.qty*i.price,0)+Number(f.get('delivery_fee')||0)-Number(f.get('discount')||0),amount=Math.max(0,Math.min(Number(f.get('paid_amount')||0),gross)),data={order_no:'VV-'+Date.now().toString().slice(-8),customer:f.get('customer').trim(),phone:f.get('phone').trim(),order_date:f.get('order_date'),address:f.get('address').trim(),area:f.get('area').trim(),assigned_fe:f.get('assigned_fe')||null,payment_method:f.get('payment_method'),items,delivery_fee:Number(f.get('delivery_fee')||0),discount:Number(f.get('discount')||0),paid_amount:amount,notes:f.get('notes').trim(),delivery_status:f.get('assigned_fe')?'Assigned':'New',payment_status:amount>=gross?'Paid':amount>0?'Partially Paid':'Pending',created_by:authUser.id,history:[{date:new Date().toISOString(),text:'Order created'}]};let r=await sb.from('oms_orders').insert(data);if(r.error)return alert('Save failed: '+r.error.message);await refresh();go('orders')}}
if($('#customerSearch'))$('#customerSearch').oninput=()=>{let q=$('#customerSearch').value.toLowerCase();$('#customerRows').querySelectorAll('tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')};if($('#deliverySearch')){let updateDelivery=()=>{let q=$('#deliverySearch').value.toLowerCase(),s=$('#deliveryFilter').value,l=visOrders().filter(o=>!['Delivered','Cancelled','Returned'].includes(o.delivery_status)&&(!q||[o.order_no,o.customer,o.phone,o.area].join(' ').toLowerCase().includes(q))&&(!s||o.delivery_status===s));$('#deliveryRows').innerHTML=ordersTable(l);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openOrder(b.dataset.edit))};$('#deliverySearch').oninput=updateDelivery;$('#deliveryFilter').onchange=updateDelivery}if($('#search')){let update=()=>{let q=$('#search').value.toLowerCase(),s=$('#filter').value,l=visOrders().filter(o=>(!q||[o.order_no,o.customer,o.phone,o.area].join(' ').toLowerCase().includes(q))&&(!s||o.delivery_status===s));$('#orderRows').innerHTML=ordersTable(l);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openOrder(b.dataset.edit))};$('#search').oninput=update;$('#filter').onchange=update}if($('#addProduct'))$('#addProduct').onclick=()=>productDialog();if($('#addExpense'))$('#addExpense').onclick=expenseDialog;document.querySelectorAll('[data-prod]').forEach(b=>b.onclick=()=>productDialog(b.dataset.prod));document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>stockDialog(b.dataset.stock));if($('#addFE'))$('#addFE').onclick=feDialog;if($('#csv'))$('#csv').onclick=csv;document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{if(!confirm('Change this account status?'))return;let r=await sb.from('oms_profiles').update({active:b.dataset.active!=='true'}).eq('user_id',b.dataset.toggle);if(r.error)return alert(r.error.message);await refresh();render()})}
(async()=>{let r=await sb.auth.getSession();if(r.data.session?.user)await start(r.data.session.user);else login()})();
}
</script></body></html>
