<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vermi Veda OMS</title><style>
:root{--g:#176b45;--d:#103d2b;--p:#e7f4eb;--ink:#1e2a23;--m:#66736a;--line:#e1e8e2;--bg:#f5f8f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial, sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;padding:10px 14px;background:var(--g);color:white;font-weight:bold;cursor:pointer}button.alt{background:#eef3ef;color:#24382b;border:1px solid var(--line)}input,select,textarea{width:100%;padding:10px;border:1px solid #d8e2da;border-radius:8px;background:white}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#e6f3e8,#f8faf8)}.login{width:min(430px,100%);background:white;border:1px solid var(--line);border-radius:18px;padding:28px}.login h1{margin:10px 0 3px}.login p,.muted{color:var(--m)}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:12px;font-weight:bold;color:#536258}.login button{width:100%}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:var(--d);color:white;padding:20px 14px;display:flex;flex-direction:column;gap:16px}.brand{font-size:18px;font-weight:bold;padding:5px 7px 17px;border-bottom:1px solid #ffffff33}.brand small{display:block;font-size:12px;color:#c2d9ca;font-weight:normal}.nav{display:grid;gap:5px}.nav button{text-align:left;background:transparent;color:#d9e9de}.nav button.active,.nav button:hover{background:#ffffff20}.side small{margin-top:auto;color:#bad1c1}.top{background:white;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:20px;margin:0}.top p{font-size:12px;margin:4px 0 0;color:var(--m)}.content{padding:22px;max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.head h2{margin:0}.panel,.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat small{color:var(--m)}.stat b{display:block;font-size:24px;margin:7px 0}.notice{padding:12px;border:1px solid #cce6d2;background:#edf7ef;color:#245a38;border-radius:9px;margin-bottom:16px}.error{padding:10px;border-radius:8px;background:#fff0ef;color:#a12f28;margin:10px 0}.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.toolbar>*{max-width:280px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:700px;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf1ed}th{font-size:11px;color:#67746a;background:#f8faf8;text-transform:uppercase}td{font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:30px;background:#edf2ee;font-size:11px;font-weight:bold}.green{background:#e3f5e8;color:#176b45}.orange{background:#fff1d9;color:#94560a}.red{background:#ffebe9;color:#a12f28}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.span2{grid-column:span 2}.span3{grid-column:1/-1}.item{display:grid;grid-template-columns:2fr 80px 100px 36px;gap:8px;margin:8px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:7px 10px}.empty{text-align:center;padding:25px;color:var(--m)}.footnote{font-size:12px;color:var(--m);margin-top:10px}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{padding:12px}.nav{grid-template-columns:repeat(4,minmax(0,1fr))}.nav button{text-align:center;padding:9px 4px;font-size:12px}.side small{display:none}.content{padding:13px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.formgrid{grid-template-columns:1fr}.span2,.span3{grid-column:auto}.stats{gap:7px}.stat{padding:11px}.stat b{font-size:20px}.top{padding:12px}.item{grid-template-columns:minmax(120px,2fr) 55px 75px 32px}.head{align-items:flex-start;flex-d </style></head><body><div id="app"></div><script>
function showOmsFatal(message){
  document.body.innerHTML = `<main style="font:16px/1.5 Arial,sans-serif;max-width:680px;margin:8vh auto;padding:24px;color:#1e2a23"><h1 style="color:#176b45">Vermi Veda OMS</h1><h2>Page could not start</h2><p>${String(message||'Unknown error').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</p><p>Refresh this page. If the issue continues, open Chrome DevTools with <b>Ctrl + Shift + J</b> and share a screenshot of the Console tab.</p><button onclick="location.reload()" style="background:#176b45;color:white;border:0;padding:10px 16px;border-radius:8px;cursor:pointer">Reload OMS</button></main>`;
}
window.addEventListener('error', function(e){ if(e && e.message) showOmsFatal('JavaScript error: '+e.message); });
window.addEventListener('unhandledrejection', function(e){ showOmsFatal('Unexpected app error: '+(e.reason?.message||e.reason||'Unknown error')); });
async function loadSupabaseLibrary(){
  if(window.supabase && typeof window.supabase.createClient==='function') return;
  const urls=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'];
  for(const url of urls){
    try { await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=url;script.onload=()=>window.supabase&&typeof window.supabase.createClient==='function'?resolve():reject(new Error('Supabase library did not initialize'));script.onerror=()=>reject(new Error('Could not load '+url));document.head.appendChild(script);}); return; }
    catch(e) { /* try the alternate CDN */ }
  }
  throw new Error('Could not load the Supabase JavaScript library. Check your internet connection or allow cdn.jsdelivr.net / unpkg.com, then reload.');
}
loadSupabaseLibrary().then(()=>bootOms()).catch(e=>showOmsFatal(e.message));
function bootOms(){
// Supabase-connected OMS. This is the public publishable key; never put a service-role key in browser code.
const URL='https://ezozfdekhjdklioelgno.supabase.co', KEY='sb_publishable_yAZ3eafe2O8p4Pvjm0mjTA_I6lMTkwP';
const sb=window.supabase.createClient(URL,KEY);let authUser=null,me=null,products=[],orders=[],staff=[],stocklog=[],page='dashboard';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),today=()=>new Date().toISOString().slice(0,10),admin=()=>me?.role==='admin',paid=o=>Number(o.paid_amount||0),total=o=>(o.items||[]).reduce((s,i)=>s+Number(i.qty||0)*Number(i.price||0),0)+Number(o.delivery_fee||0)-Number(o.discount||0),balance=o=>Math.max(0,total(o)-paid(o)),pBy=id=>products.find(p=>p.id===id),visOrders=()=>admin()?orders:orders.filter(o=>o.assigned_fe===authUser.id),status=s=>`<span class="pill ${['Delivered','Paid','Active'].includes(s)?'green':['Assigned','Out for Delivery','Partially Paid'].includes(s)?'orange':['Failed','Cancelled','Returned','Inactive'].includes(s)?'red':''}">${esc(s||'Pending')}</span>`;
function login(message=''){document.body.innerHTML=`<div id="app"><div class="loginwrap"><form class="login" id="login"><div style="font-size:30px">🌱</div><h1>Vermi Veda OMS</h1><p>Order management & field delivery portal</p><div class="field"><label>Work email</label><input name="email" type="email" required autocomplete="username" placeholder="name@company.com"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button id="signIn">Sign in securely</button>${message?`<div class="error">${esc(message)}</div>`:''}<div class="footnote">Staff accounts are created by the Admin. Public registration is not available.</div><div id="err" class="error" style="display:none"></div></form></div></div>`;$('#login').onsubmit=async e=>{e.preventDefault();$('#signIn').disabled=true;const f=new FormData(e.target),r=await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('password'))});if(r.error){$('#err').style.display='block';$('#err').textContent=r.error.message;$('#signIn').disabled=false;return}await start(r.data.user)}}
async function start(user){authUser=user;const r=await sb.from('oms_profiles').select('user_id,full_name,role,active').eq('user_id',user.id).single();if(r.error||!r.data){await sb.auth.signOut();authUser=null;return login('Profile not configured. Ask the administrator to set up your account.')}me=r.data;if(!me.active){await sb.auth.signOut();authUser=null;return login('Your account is inactive. Contact the administrator.')}try{await refresh();page='dashboard';render()}catch(e){login('Database error: '+e.message)}}
async function refresh(){const [p,o,u]=await Promise.all([sb.from('oms_products').select('*').order('name'),sb.from('oms_orders').select('*').order('created_at',{ascending:false}),sb.from('oms_profiles').select('user_id,full_name,role,active').order('full_name')]);if(p.error)throw p.error;if(o.error)throw o.error;if(u.error)throw u.error;products=p.data||[];orders=o.data||[];staff=(u.data||[]).map(x=>({...x,id:x.user_id,name:x.full_name}));if(admin()){const l=await sb.from('oms_stock_log').select('*').order('created_at',{ascending:false}).limit(100);stocklog=l.data||[]}}
const nav=[['dashboard','Dashboard'],['orders','Orders'],['new','New Order'],['inventory','Inventory'],['payments','Payments'],['reports','Reports'],['team','FE & Users']];function go(p){page=p;render()}function render(){if(!authUser||!me)return login();if(!admin()&&!['dashboard','orders','payments'].includes(page))page='dashboard';document.body.innerHTML=`<div id="app"><div class="shell"><aside class="side"><div class="brand">🌱 Vermi Veda<small>Order Management</small></div><div class="nav">${nav.filter(n=>admin()||['dashboard','orders','payments'].includes(n[0])).map(n=>`<button class="${page===n[0]?'active':''}" data-page="${n[0]}">${n[1]}</button>`).join('')}</div><small>Shared Supabase database</small></aside><main><header class="top"><div><h1>${nav.find(n=>n[0]===page)?.[1]||'Dashboard'}</h1><p>Shared order-to-delivery tracking</p></div><div><b>${esc(me.full_name||authUser.email)}</b> · ${admin()?'Admin':'Field Executive'} <button class="alt" id="logout">Log out</button></div></header><div class="content" id="content"></div></main></div></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#logout').onclick=async()=>{await sb.auth.signOut();authUser=me=null;login()};draw()}
function stat(label,n,sub){return `<div class="stat"><small>${label}</small><b>${n}</b><small>${sub||''}</small></div>`}function draw(){let c=$('#content');if(page==='dashboard')c.innerHTML=dashboard();if(page==='orders')c.innerHTML=ordersPage();if(page==='new')c.innerHTML=orderForm();if(page==='inventory')c.innerHTML=inventoryPage();if(page==='payments')c.innerHTML=paymentsPage();if(page==='reports')c.innerHTML=reportsPage();if(page==='team')c.innerHTML=teamPage();bind()}
function dashboard(){let a=visOrders();return `<div class="notice">${admin()?'Enter WhatsApp orders, assign FEs, and track stock and collections.':'You can see only orders assigned to your account. Update delivery and payment after completing each order.'}</div><div class="stats">${stat('Total orders',a.length,'Visible orders')}${stat('Pending delivery',a.filter(o=>!['Delivered','Cancelled','Returned'].includes(o.delivery_status)).length,'Need action')}${stat('Delivered sales',money(a.filter(o=>o.delivery_status==='Delivered').reduce((s,o)=>s+total(o),0)),'Delivered order value')}${stat('Collected',money(a.reduce((s,o)=>s+paid(o),0)),'Recorded collections')}</div><div class="panel"><div class="head"><h3>Recent orders</h3><button class="alt" data-go="orders">View orders</button></div>${ordersTable(a.slice(0,8))}</div>${admin()?'<div class="actions"><button data-go="new">＋ Enter WhatsApp order</button><button class="alt" data-go="team">Manage FE accounts</button></div>':''}`}
function ordersTable(list){if(!list.length)return '<div class="empty">No orders found.</div>';return `<div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>FE</th><th>Delivery</th><th>Payment</th><th></th></tr></thead><tbody>${list.map(o=>`<tr><td><b>${esc(o.order_no)}</b><div class="muted">${esc(o.order_date)}</div></td><td>${esc(o.customer)}<div class="muted">${esc(o.phone)}</div></td><td>${(o.items||[]).map(i=>`${esc(i.name)} × ${i.qty}`).join('<br>')}</td><td>${money(total(o))}</td><td>${esc(staff.find(u=>u.id===o.assigned_fe)?.name||'Unassigned')}</td><td>${status(o.delivery_status)}</td><td>${status(o.payment_status)}<div class="muted">${money(paid(o))} collected</div></td><td><button class="alt" data-edit="${o.id}">Open</button></td></tr>`).join('')}</tbody></table></div>`}
function ordersPage(){return `<div class="head"><div><h2>Order register</h2><p class="muted">Search orders and update delivery or collection.</p></div>${admin()?'<button data-go="new">＋ New order</button>':''}</div><div class="panel"><div class="toolbar"><input id="search" placeholder="Search order, customer, phone"><select id="filter"><option value="">All statuses</option>${['New','Assigned','Out for Delivery','Delivered','Failed','Cancelled','Returned'].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="orderRows">${ordersTable(visOrders())}</div></div>`}
function orderForm(){return `<div class="panel"><h2>Enter WhatsApp order</h2><form id="newOrder"><div class="formgrid"><div class="field"><label>Customer *</label><input name="customer" required></div><div class="field"><label>Phone *</label><input name="phone" required></div><div class="field"><label>Order date</label><input name="order_date" type="date" value="${today()}" required></div><div class="field span2"><label>Address *</label><textarea name="address" required></textarea></div><div class="field"><label>Area</label><input name="area"></div><div class="field"><label>Assign FE</label><select name="assigned_fe"><option value="">Unassigned</option>${staff.filter(u=>u.role==='fe'&&u.active).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>Payment method</label><select name="payment_method"><option>Cash</option><option>UPI</option><option>Online prepaid</option><option>Other</option></select></div><div class="field span3"><label>Products *</label><div id="items"></div><button type="button" class="alt" id="addItem">＋ Add product</button></div><div class="field"><label>Delivery fee</label><input name="delivery_fee" type="number" min="0" value="0"></div><div class="field"><label>Discount</label><input name="discount" type="number" min="0" value="0"></div><div class="field"><label>Advance paid</label><input name="paid_amount" type="number" min="0" value="0"></div><div class="field span3"><label>Notes</label><textarea name="notes"></textarea></div></div><p class="formactions"><button type="button" class="alt" data-go="orders">Cancel</button> <button>Save to shared database</button></p></form></div>`}
function itemRow(){return `<div class="item"><select class="ip">${products.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)} (${money(p.price)})</option>`).join('')}</select><input class="iq" type="number" min="1" value="1" required><input class="iv" type="number" min="0" step=".01" required><button type="button" class="alt remove">×</button></div>`}
function inventoryPage(){return `<div class="head"><div><h2>Inventory</h2><p class="muted">Products and stock are saved in Supabase.</p></div><button id="addProduct">＋ Add product</button></div><div class="panel"><div id="productRows">${productTable()}</div></div><div class="panel"><h3>Stock movement log</h3>${stocklog.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Product</th><th>Change</th><th>Reason</th></tr>${stocklog.map(x=>`<tr><td>${esc(x.created_at?.slice(0,10))}</td><td>${esc(x.product_name)}</td><td>${x.quantity_change>0?'+':''}${x.quantity_change}</td><td>${esc(x.reason)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No stock movements.</div>'}</div>`}function productTable(){return `<div class="tablewrap"><table><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Action</th></tr>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><div class="actions"><button class="alt" data-stock="${p.id}">Adjust stock</button><button class="alt" data-prod="${p.id}">Edit</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No products yet.</td></tr>'}</table></div>`}
function paymentsPage(){let a=visOrders();return `<div class="stats">${stat('Order value',money(a.reduce((s,o)=>s+total(o),0)),'Visible orders')}${stat('Collected',money(a.reduce((s,o)=>s+paid(o),0)),'Recorded')}${stat('Outstanding',money(a.reduce((s,o)=>s+balance(o),0)),'Balance due')}${stat('Orders',a.length,'Visible orders')}</div><div class="panel">${ordersTable(a)}</div>`}
function reportsPage(){let d=orders.filter(o=>o.delivery_status==='Delivered');return `<div class="head"><h2>Reports</h2><button id="csv">Export CSV</button></div><div class="stats">${stat('Orders today',orders.filter(o=>o.order_date===today()).length,'Today')}${stat('Delivered',d.length,'All time')}${stat('Delivered sales',money(d.reduce((s,o)=>s+total(o),0)),'Order value')}${stat('Outstanding',money(orders.reduce((s,o)=>s+balance(o),0)),'All orders')}</div><div class="panel"><h3>FE-wise performance</h3><div class="tablewrap"><table><tr><th>FE</th><th>Assigned</th><th>Delivered</th><th>Collected</th></tr>${staff.filter(u=>u.role==='fe').map(u=>{let a=orders.filter(o=>o.assigned_fe===u.id);return `<tr><td>${esc(u.name)}</td><td>${a.length}</td><td>${a.filter(o=>o.delivery_status==='Delivered').length}</td><td>${money(a.reduce((s,o)=>s+paid(o),0))}</td></tr>`}).join('')}</table></div></div>`}
function teamPage(){return `<div class="head"><div><h2>FE & Users</h2><p class="muted">Create FE accounts securely through Supabase Auth.</p></div><button id="addFE">＋ Add FE</button></div><div class="notice">Passwords are handled by Supabase Auth, not stored in browser storage.</div><div class="panel"><div class="tablewrap"><table><tr><th>Name</th><th>Role</th><th>Status</th><th>Account</th><th>Action</th></tr>${staff.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${status(u.active?'Active':'Inactive')}</td><td>${esc(u.id)}</td><td>${u.id===authUser.id?'Current account':`<button class="alt" data-toggle="${u.id}" data-active="${u.active}">${u.active?'Deactivate':'Activate'}</button>`}</td></tr>`).join('')}</table></div></div>`}
function modal(title,body){$('#modal')?.remove();document.body.insertAdjacentHTML('beforeend',`<div id="modal" style="position:fixed;inset:0;background:#0d2017a8;display:grid;place-items:center;padding:16px;z-index:99"><div style="background:white;border-radius:14px;padding:22px;width:min(580px,100%);max-height:90vh;overflow:auto"><div class="head"><h3>${title}</h3><button class="alt" id="close">×</button></div>${body}</div></div>`);$('#close').onclick=()=>$('#modal').remove();return $('#modal')}
function openOrder(id){let o=orders.find(x=>x.id===id);if(!o)return;let m=modal('Order '+esc(o.order_no),`<form id="edit"><div class="formgrid"><div class="field"><label>Customer</label><input value="${esc(o.customer)}" disabled></div><div class="field"><label>Phone</label><input value="${esc(o.phone)}" disabled></div><div class="field"><label>Total</label><input value="${money(total(o))}" disabled></div><div class="field span3"><label>Address</label><textarea disabled>${esc(o.address)}</textarea></div><div class="field"><label>Delivery status</label><select name="delivery_status">${['New','Assigned','Out for Delivery','Delivered','Failed','Cancelled','Returned'].map(s=>`<option ${o.delivery_status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Assigned FE</label><select name="assigned_fe" ${admin()?'':'disabled'}><option value="">Unassigned</option>${staff.filter(u=>u.role==='fe').map(u=>`<option value="${u.id}" ${o.assigned_fe===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>Payment method</label><select name="payment_method">${['Cash','UPI','Online prepaid','Other'].map(s=>`<option ${o.payment_method===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Collected amount</label><input name="paid_amount" type="number" min="0" max="${total(o)}" step=".01" value="${paid(o)}"></div><div class="field span2"><label>Delivery remarks</label><textarea name="delivery_remark">${esc(o.delivery_remark||'')}</textarea></div><div class="field span3"><label>Notes</label><textarea name="notes">${esc(o.notes||'')}</textarea></div></div><p class="muted">Outstanding: ${money(balance(o))}</p><button>Save changes</button></form>`);$('#edit').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),amount=Math.min(Math.max(0,Number(f.get('paid_amount')||0)),total(o)),patch={delivery_status:f.get('delivery_status'),payment_method:f.get('payment_method'),paid_amount:amount,payment_status:amount>=total(o)?'Paid':amount>0?'Partially Paid':'Pending',delivery_remark:f.get('delivery_remark'),notes:f.get('notes'),history:[...(o.history||[]),{date:new Date().toISOString(),text:'Updated by '+me.full_name}]};if(admin())patch.assigned_fe=f.get('assigned_fe')||null;const r=await sb.from('oms_orders').update(patch).eq('id',o.id);if(r.error){alert(r.error.message);return}m.remove();await refresh();render()}}
function productDialog(id){let p=id?pBy(id):{name:'',sku:'',price:0,stock:0},m=modal(id?'Edit product':'Add product',`<form id="prod"><div class="field"><label>Name</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>SKU</label><input name="sku" required value="${esc(p.sku)}"></div><div class="formgrid"><div class="field"><label>Price</label><input name="price" type="number" min="0" step=".01" required value="${p.price}"></div><div class="field"><label>Stock</label><input name="stock" type="number" min="0" required value="${p.stock}"></div></div><button>Save product</button></form>`);$('#prod').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),data={name:f.get('name').trim(),sku:f.get('sku').trim(),price:Number(f.get('price')),stock:Number(f.get('stock'))};let r=id?await sb.from('oms_products').update(data).eq('id',id):await sb.from('oms_products').insert(data);if(r.error){alert(r.error.message);return}m.remove();await refresh();render()}}
function stockDialog(id){let p=pBy(id),m=modal('Adjust stock',`<p>${esc(p.name)} current stock: ${p.stock}</p><form id="stock"><div class="field"><label>Change (+/-)</label><input name="change" type="number" required></div><div class="field"><label>Reason</label><input name="reason" required></div><button>Save adjustment</button></form>`);$('#stock').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),n=Number(f.get('change'));if(p.stock+n<0)return alert('Stock cannot be negative');let r=await sb.from('oms_products').update({stock:p.stock+n}).eq('id',id);if(r.error)return alert(r.error.message);await sb.from('oms_stock_log').insert({product_id:id,product_name:p.name,quantity_change:n,reason:f.get('reason'),created_by:authUser.id});m.remove();await refresh();render()}}
function feDialog(){let m=modal('Create FE account',`<form id="fe"><div class="field"><label>Full name *</label><input name="full_name" required></div><div class="field"><label>Work email *</label><input name="email" type="email" required></div><div class="field"><label>Username (reference only)</label><input name="username"></div><div class="field"><label>Temporary password (min. 8 characters)</label><input name="password" type="password" minlength="8" required></div><div id="feErr"></div><button id="createFE">Create FE</button><p class="footnote">Send temporary credentials securely. The password is not saved in the OMS database.</p></form>`);$('#fe').onsubmit=async e=>{e.preventDefault();$('#createFE').disabled=true;let f=new FormData(e.target),r=await sb.functions.invoke('oms-create-fe',{body:{full_name:f.get('full_name').trim(),email:f.get('email').trim(),username:f.get('username').trim(),password:f.get('password')}});if(r.error||r.data?.error){$('#feErr').innerHTML=`<div class="error">${esc(r.data?.error||r.error.message)}</div>`;$('#createFE').disabled=false;return}alert('FE account created.');m.remove();await refresh();render()}}
function csv(){let rows=[['Order ID','Date','Customer','Phone','Address','Area','Products','Order Value','Collected','Balance','FE','Delivery Status','Payment Status','Payment Method','Remarks']];orders.forEach(o=>rows.push([o.order_no,o.order_date,o.customer,o.phone,o.address,o.area,(o.items||[]).map(i=>i.name+' x'+i.qty).join('; '),total(o),paid(o),balance(o),staff.find(u=>u.id===o.assigned_fe)?.name||'',o.delivery_status,o.payment_status,o.payment_method,o.delivery_remark||o.notes||'']));let blob=new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vermiveda_orders_'+today()+'.csv';a.click();URL.revokeObjectURL(a.href)}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openOrder(b.dataset.edit));if($('#newOrder')){if(!products.filter(p=>p.active).length){$('#items').innerHTML='<div class="error">Add products in Inventory first.</div>';return}const rows=$('#items');function wire(r){let s=r.querySelector('.ip'),v=r.querySelector('.iv');const price=()=>v.value=pBy(s.value)?.price||0;s.onchange=price;price();r.querySelector('.remove').onclick=()=>{if(rows.children.length>1)r.remove()}}rows.innerHTML=itemRow();wire(rows.firstElementChild);$('#addItem').onclick=()=>{rows.insertAdjacentHTML('beforeend',itemRow());wire(rows.lastElementChild)};$('#newOrder').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),items=[...rows.querySelectorAll('.item')].map(r=>{let p=pBy(r.querySelector('.ip').value);return {productId:p.id,name:p.name,sku:p.sku,qty:Number(r.querySelector('.iq').value),price:Number(r.querySelector('.iv').value)}}),gross=items.reduce((s,i)=>s+i.qty*i.price,0)+Number(f.get('delivery_fee')||0)-Number(f.get('discount')||0),amount=Math.max(0,Math.min(Number(f.get('paid_amount')||0),gross)),data={order_no:'VV-'+Date.now().toString().slice(-8),customer:f.get('customer').trim(),phone:f.get('phone').trim(),order_date:f.get('order_date'),address:f.get('address').trim(),area:f.get('area').trim(),assigned_fe:f.get('assigned_fe')||null,payment_method:f.get('payment_method'),items,delivery_fee:Number(f.get('delivery_fee')||0),discount:Number(f.get('discount')||0),paid_amount:amount,notes:f.get('notes').trim(),delivery_status:f.get('assigned_fe')?'Assigned':'New',payment_status:amount>=gross?'Paid':amount>0?'Partially Paid':'Pending',created_by:authUser.id,history:[{date:new Date().toISOString(),text:'Order created'}]};let r=await sb.from('oms_orders').insert(data);if(r.error)return alert('Save failed: '+r.error.message);await refresh();go('orders')}}
if($('#search')){let update=()=>{let q=$('#search').value.toLowerCase(),s=$('#filter').value,l=visOrders().filter(o=>(!q||[o.order_no,o.customer,o.phone,o.area].join(' ').toLowerCase().includes(q))&&(!s||o.delivery_status===s));$('#orderRows').innerHTML=ordersTable(l);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openOrder(b.dataset.edit))};$('#search').oninput=update;$('#filter').onchange=update}if($('#addProduct'))$('#addProduct').onclick=()=>productDialog();document.querySelectorAll('[data-prod]').forEach(b=>b.onclick=()=>productDialog(b.dataset.prod));document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>stockDialog(b.dataset.stock));if($('#addFE'))$('#addFE').onclick=feDialog;if($('#csv'))$('#csv').onclick=csv;document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{if(!confirm('Change this account status?'))return;let r=await sb.from('oms_profiles').update({active:b.dataset.active!=='true'}).eq('user_id',b.dataset.toggle);if(r.error)return alert(r.error.message);await refresh();render()})}
